<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="GENDESU, freelance developer and creator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0d1f33"/>
      <stop offset="1" stop-color="#150d2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5eead4" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <rect x="-40" y="-40" width="1280" height="400" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </rect>

    <circle cx="180" cy="80" r="110" fill="#00d4ff" opacity="0.35" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 90 40; 20 90; 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="260" r="120" fill="#a855f7" opacity="0.38" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -120 -50; 60 -70; 0 0" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="60" r="100" fill="#ec4899" opacity="0.25" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 60; 30 20; 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>

    <rect x="-300" y="0" width="300" height="320" fill="url(#sweep)" transform="skewX(-20)">
      <animate attributeName="x" from="-400" to="1500" dur="7s" repeatCount="indefinite"/>
    </rect>

    <g fill="#ffffff">
      <circle cx="90" cy="40" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="30" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="58" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="22" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="300" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="296" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.2s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="1170" cy="300" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.6s" begin="2.1s" repeatCount="indefinite"/></circle>
    </g>

    <path d="M0 292 C 200 262 400 322 600 292 S 1000 262 1200 292 V320 H0Z" fill="#00d4ff" opacity="0.10">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0 292 C 200 262 400 322 600 292 S 1000 262 1200 292 V320 H0Z;M0 292 C 200 322 400 262 600 292 S 1000 322 1200 292 V320 H0Z;M0 292 C 200 262 400 322 600 292 S 1000 262 1200 292 V320 H0Z"/>
    </path>
    <path d="M0 302 C 250 282 450 322 700 302 S 1000 282 1200 302 V320 H0Z" fill="#a855f7" opacity="0.14">
      <animate attributeName="d" dur="11s" repeatCount="indefinite"
        values="M0 302 C 250 282 450 322 700 302 S 1000 282 1200 302 V320 H0Z;M0 302 C 250 322 450 282 700 302 S 1000 322 1200 302 V320 H0Z;M0 302 C 250 282 450 322 700 302 S 1000 282 1200 302 V320 H0Z"/>
    </path>

    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <g>
        <rect x="60" y="62" width="10" height="10" rx="2" fill="#00d4ff">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
        </rect>
        <text x="80" y="72" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="4" fill="#7dd3fc">FREELANCE DEVELOPER · CREATOR</text>
      </g>

      <text x="56" y="168" font-size="92" font-weight="800" letter-spacing="3" fill="url(#name)" filter="url(#glow)">GENDESU<animate attributeName="opacity" from="0" to="1" dur="1.1s" fill="freeze"/></text>

      <text x="60" y="212" font-size="22" fill="#cbd5e1" letter-spacing="0.5">Content automation  <tspan fill="#00d4ff">•</tspan>  AI tools  <tspan fill="#a855f7">•</tspan>  Short-form video<animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/></text>

      <rect x="60" y="228" width="0" height="4" rx="2" fill="url(#frame)">
        <animate attributeName="width" from="0" to="300" dur="1.4s" fill="freeze"/>
      </rect>

      <g font-size="14" font-weight="600" text-anchor="middle">
        <g>
          <rect x="60" y="250" width="86" height="30" rx="15" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-opacity="0.6"/>
          <text x="103" y="270" fill="#7dd3fc">Python</text>
        </g>
        <g>
          <rect x="156" y="250" width="110" height="30" rx="15" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.6"/>
          <text x="211" y="270" fill="#fde68a">JavaScript</text>
        </g>
        <g>
          <rect x="276" y="250" width="116" height="30" rx="15" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-opacity="0.65"/>
          <text x="334" y="270" fill="#d8b4fe">AI Automation</text>
        </g>
        <g>
          <rect x="402" y="250" width="96" height="30" rx="15" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-opacity="0.6"/>
          <text x="450" y="270" fill="#f9a8d4">Video</text>
        </g>
      </g>
    </g>

    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <g>
        <rect x="810" y="34" width="340" height="76" rx="14" fill="#0b1324" fill-opacity="0.7" stroke="#ff4d4d" stroke-opacity="0.7"/>
        <circle cx="850" cy="72" r="20" fill="#ff0000"/>
        <path d="M843 62 L843 82 L860 72Z" fill="#fff"/>
        <text x="890" y="70" font-size="34" font-weight="800" fill="#fff">570K</text>
        <text x="890" y="95" font-size="14" fill="#94a3b8" letter-spacing="2">YOUTUBE SUBSCRIBERS</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="810" y="122" width="340" height="76" rx="14" fill="#0b1324" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.7"/>
        <circle cx="850" cy="160" r="20" fill="#000" stroke="#22d3ee" stroke-width="2"/>
        <path d="M855 150 V167 a6 6 0 1 1 -6 -6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
        <text x="890" y="158" font-size="34" font-weight="800" fill="#fff">750K</text>
        <text x="890" y="183" font-size="14" fill="#94a3b8" letter-spacing="2">TIKTOK FOLLOWERS</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" begin="0.8s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="810" y="210" width="340" height="76" rx="14" fill="#0b1324" fill-opacity="0.7" stroke="#3b82f6" stroke-opacity="0.8"/>
        <circle cx="850" cy="248" r="20" fill="#1877f2"/>
        <text x="850" y="259" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">f</text>
        <text x="890" y="246" font-size="34" font-weight="800" fill="#fff">450K</text>
        <text x="890" y="271" font-size="14" fill="#94a3b8" letter-spacing="2">FACEBOOK FOLLOWERS</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" begin="1.6s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="317" rx="17" fill="none" stroke="url(#frame)" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="260 1400">
    <animate attributeName="stroke-dashoffset" from="0" to="-1660" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
